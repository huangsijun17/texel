
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "texel-importer"
version = "0.999.3"
description = "Convert PNG images to deterministic, diff-friendly PXL source files"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "GT6 Modern contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gt6-modern/texel"
Documentation = "https://github.com/gt6-modern/texel#readme"
Issues = "https://github.com/gt6-modern/texel/issues"
Source = "https://github.com/gt6-modern/texel"

[project.scripts]
texel-import = "importer.__main__:main"

[tool.setuptools]
packages = ["importer"]
